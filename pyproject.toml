[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-rescaler"
version = "1.0.0"
description = "A Python package for rescaling simulated event quantities."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["src"]